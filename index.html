<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d0a2a">
<title>Pikman · plataformas</title>
<style>
  :root{ --ink:#2b0f1f; --gold:#ffe08a; --deep:#1d0a2a; --cream:#fff4e0; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--deep); overflow:hidden; touch-action:manipulation;
    -webkit-user-select:none; user-select:none; font-family:"Trebuchet MS",Verdana,system-ui,sans-serif; color:var(--cream); }
  #app{ position:relative; height:100%; width:100%; overflow:hidden; }

  .screen{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));
    background-size:cover; background-position:center; }
  .screen.on{ display:flex; }
  #scTitle{ justify-content:center; text-align:center; background-color:var(--deep); }
  #scPlay{ background:radial-gradient(ellipse at 50% 0%, #3b1450, #1d0a2a 70%); }

  .hero{ width:132px; margin-bottom:6px; animation:bob 2.4s ease-in-out infinite; filter:drop-shadow(0 10px 14px rgba(0,0,0,.45)); }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-3deg); } 50%{ transform:translateY(-10px) rotate(3deg); } }
  .ttl{ margin:0; font-family:"Arial Black",Impact,sans-serif; font-size:clamp(44px,14vw,64px); letter-spacing:1px;
    background:linear-gradient(180deg,#fff0c2,#ffb347 55%,#ff5e3a); -webkit-background-clip:text; background-clip:text;
    color:transparent; filter:drop-shadow(0 4px 0 #5a1d0c); }
  .sub{ margin:.5em 0 1.8em; font-size:15px; color:#ffd9a8; line-height:1.5; }
  .sub span{ font-size:12px; opacity:.85; }
  .diff{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .bt{ font-family:inherit; font-weight:900; font-size:17px; color:var(--ink); min-width:136px;
    background:linear-gradient(180deg,#ffe08a,#ff9f45); border:0; border-radius:16px; padding:12px 22px;
    box-shadow:0 5px 0 #8a3a1a; cursor:pointer; }
  .bt small{ display:block; font-size:11px; font-weight:700; opacity:.8; margin-top:2px; }
  .bt.alt{ background:linear-gradient(180deg,#f3c9a8,#e0785a); }
  .bt:active{ transform:translateY(4px); box-shadow:0 1px 0 #8a3a1a; }
  .credit{ position:absolute; bottom:calc(8px + env(safe-area-inset-bottom,0px)); left:0; right:0; font-size:11px; opacity:.55; margin:0; }

  .snd{ position:absolute; top:calc(10px + env(safe-area-inset-top,0px)); right:10px; z-index:9;
    background:rgba(20,6,30,.6); border:1px solid rgba(255,220,150,.35); color:var(--cream);
    border-radius:999px; padding:5px 10px; font-size:15px; cursor:pointer; }

  .hud{ width:100%; max-width:420px; display:flex; gap:8px; justify-content:center; align-items:center; padding-right:50px; }
  .chip{ display:flex; align-items:center; gap:6px; background:rgba(20,6,30,.65); border:1px solid rgba(255,220,150,.3);
    border-radius:999px; padding:5px 11px; font-weight:900; font-size:16px; white-space:nowrap; }
  .chip img{ height:22px; width:auto; }
  .chip.lvl{ font-size:13px; font-weight:700; color:#ffd9a8; }
  .boost{ width:100%; max-width:420px; height:8px; margin-top:8px; background:rgba(255,255,255,.14); border-radius:99px; overflow:hidden; }
  #boostFill{ height:100%; width:0; background:linear-gradient(90deg,#ffe08a,#ff9f1c); }

  .stage{ position:relative; margin-top:10px; display:flex; justify-content:center; }
  #game{ display:block; height:min(calc(100vh - 190px), calc(94vw * 1.5)); height:min(calc(100dvh - 190px), calc(94vw * 1.5)); aspect-ratio:2/3; width:auto; max-width:100%;
    border-radius:16px; border:2px solid rgba(255,220,150,.35); box-shadow:0 10px 30px rgba(0,0,0,.45); }
  .card{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:78%; max-width:300px;
    background:rgba(20,6,30,.93); border:2px solid #ffb347; border-radius:18px; padding:18px 16px;
    text-align:center; display:none; z-index:5; }
  .card.on{ display:block; }
  .card h2{ margin:0 0 8px; font-family:"Arial Black",Impact,sans-serif; font-size:21px; color:var(--gold); }
  .card p{ margin:0 0 14px; font-size:15px; line-height:1.4; }

  .pad{ width:100%; max-width:420px; margin-top:auto; padding-top:10px; display:flex; justify-content:space-between; align-items:flex-end; }
  .grp{ display:flex; gap:12px; }
  .pb{ width:68px; height:68px; border-radius:50%; border:2px solid rgba(255,240,200,.45); background:rgba(255,190,120,.22);
    color:var(--cream); font-size:26px; font-weight:900; display:flex; align-items:center; justify-content:center;
    touch-action:none; cursor:pointer; }
  .pb:active{ background:rgba(255,224,138,.5); }
  .pb.jump{ background:rgba(255,224,138,.3); }
  .pb.thr{ background:rgba(120,190,255,.2); }
  .pb.thr img{ height:40px; width:auto; transform:rotate(60deg); }
  .pb.thr.dim{ opacity:.35; }
</style>
</head>
<body>
<div id="app">
  <button id="soundBtn" class="snd" aria-label="Sonido">🔊</button>

  <section id="scTitle" class="screen on">
    <img id="hero" class="hero" alt="">
    <h1 class="ttl">Pikman</h1>
    <p class="sub">Plataformas · 3 niveles<br><span>◀ ▶ moverse · ▲ saltar · con el globo lanzas cigarros</span></p>
    <div class="diff">
      <button id="btnEasy" class="bt">Fácil<small>5 vidas · enemigos lentos</small></button>
      <button id="btnHard" class="bt alt">Difícil<small>3 vidas · más reto</small></button>
    </div>
    <p class="credit">Sonidos: Kenney.nl (CC0)</p>
  </section>

  <section id="scPlay" class="screen">
    <div class="hud">
      <div class="chip"><img id="hPikman" alt=""><span id="hLives">5</span></div>
      <div class="chip"><img id="hCrys" alt=""><span id="hPts">0</span></div>
      <div class="chip lvl" id="hLvl">Nivel 1</div>
    </div>
    <div class="boost"><div id="boostFill"></div></div>
    <div class="stage">
      <canvas id="game"></canvas>
      <div id="card" class="card">
        <h2 id="cTitle"></h2>
        <p id="cText"></p>
        <button id="cBtn" class="bt">Continuar</button>
      </div>
    </div>
    <div class="pad">
      <div class="grp">
        <button id="bL" class="pb" aria-label="izquierda">◀</button>
        <button id="bR" class="pb" aria-label="derecha">▶</button>
      </div>
      <div class="grp">
        <button id="bT" class="pb thr dim" aria-label="lanzar cigarro"><img id="thrImg" alt=""></button>
        <button id="bJ" class="pb jump" aria-label="saltar">▲</button>
      </div>
    </div>
  </section>
</div>

// ================= 4. DOM =================
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

// ================= 5. estado =================
const S = { state:'title', lvl:0, lives:5, total:0, pts:0, boostT:0, cool:0, banner:0 };
const input = { left:false, right:false, jumpQ:false, throwQ:false };
let L = null, P = null, camX = 0, frameN = 0;

// ================= 6. helpers =================
const box = (l, r, t, bt) => ({ l, r, t, b: bt });
const overlap = (a, b) => a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;
function addFloat(x, y, s){ L.flo.push({ x, y, t:0, s }); }

let soundOn = true;
const sfxCache = {};
function sfx(n){
  if(!soundOn) return;
  try{
    if(!sfxCache[n]) sfxCache[n] = new Audio(SND[n]);
    const a = sfxCache[n].cloneNode(); a.volume = 0.5;
    const p = a.play(); if(p && p.catch) p.catch(() => {});
  }catch(e){}
}
function buzz(p){ if(navigator.vibrate) navigator.vibrate(p); }

// ================= 7. niveles =================
const CHASE_K = 2.2, DETECT_X = 150, ALERT_F = 34, LOSE_F = 120, JBUF = 8;
const isHard = () => diff === DIFF.hard;

function buildLevel(i){
  const d = LEVELS[i];
  const crystals = [];
  d.plats.forEach((p, k) => { if(k > 0 && k !== d.boss) crystals.push({ x:p.x + p.w/2, y:p.y - 36, got:false }); });
  if(d.boss !== null){
    const a = d.plats[d.boss];
    crystals.push({ x:a.x + a.w*0.3, y:a.y - 36, got:false }, { x:a.x + a.w*0.75, y:a.y - 36, got:false });
  }
  d.gapCrys.forEach(c => crystals.push({ x:c.x, y:c.y, got:false }));
  const chilis = d.chili.map(c => { const p = d.plats[c.pi]; return { x:p.x + p.w/2 + (c.dx || 0), y:p.y - 26, got:false }; });
  const enemies = d.enemies.map((pi, k) => {
    const p = d.plats[pi], cx = p.x + p.w/2;
    return { p, x:cx, minX:p.x + 14, maxX:p.x + p.w - 14, dir:(k % 2 ? -1 : 1), vx:0,
             state:'patrol', timer:0, lost:0, seen:cx, y:p.y - 26, alive:true, wob:k * 1.7 };
  });
  let boss = null;
  if(d.boss !== null){
    const a = d.plats[d.boss];
    boss = { x:a.x + a.w*0.7, minX:a.x + 50, maxX:a.x + a.w - 50, dir:-1, vx:0, top:a.y - 84,
             hp:diff.bossHP, maxHp:diff.bossHP, immune:0, alive:true, wob:0,
             st:'patrol', t:0, cd:isHard() ? 120 : 200, fireCd:isHard() ? 110 : 160 };
  }
  L = { def:d, plats:d.plats, len:d.len, crystals, chilis, enemies, boss, proj:[], bproj:[], pops:[], flo:[] };
  const p0 = d.plats[0];
  P = { x:40, y:p0.y, vx:0, vy:0, onGround:true, facing:1, check:{ x:40, y:p0.y },
        inv:0, tilt:0, walk:0, jbuf:0, combo:0 };
  camX = 0;
}

// ================= 8. daño, premios y finales =================
function killFx(x, y, pts, label){
  L.pops.push({ x, y, t:0, dur:45, big:false });
  S.pts += pts;
  addFloat(x, y - 10, '+' + pts + (label ? ' ' + label : ''));
  sfx('jump'); buzz(15);
}
function bossHit(){
  const b = L.boss;
  if(!b || !b.alive || b.immune > 0) return;
  b.hp--; b.immune = IMMUNE_FRAMES; S.pts += 40;
  sfx('hit'); buzz(20); addFloat(b.x, b.top, '+40 ¡Golpe!');
  if(b.hp <= 0){
    b.alive = false; S.pts += 300;
    L.pops.push({ x:b.x, y:b.top + 40, t:0, dur:70, big:true });
    addFloat(b.x, b.top - 10, '+300');
    sfx('win'); buzz([30, 40, 30]);
  }
}
function hurt(){
  if(P.inv > 0) return;
  S.lives--; P.inv = INV_FRAMES; P.vy = -5; P.vx = 0; P.combo = 0;
  P.x = Math.max(PW/2, P.x - P.facing * 18);
  sfx('hit'); buzz(30); addFloat(P.x, P.y - PH, '¡Auch!');
  if(S.lives <= 0) gameOver();
}
function pitFall(){
  S.lives--; sfx('hit'); buzz([30, 30, 30]);
  if(S.lives <= 0){ gameOver(); return; }
  P.x = P.check.x; P.y = P.check.y; P.vx = 0; P.vy = 0; P.onGround = true; P.inv = INV_FRAMES; P.combo = 0;
  addFloat(P.x, P.y - PH, '¡Ups!');
}
function gameOver(){
  S.state = 'card';
  showCard('Se acabaron las vidas', 'Vuelve a intentar este nivel.', 'Reintentar nivel', () => startLevel(S.lvl));
}
function levelComplete(){
  S.state = 'card';
  const total = L.crystals.length, got = L.crystals.filter(c => c.got).length;
  const r = got / total, stars = r >= 0.9 ? 3 : (r >= 0.6 ? 2 : 1);
  const info = '★'.repeat(stars) + '☆'.repeat(3 - stars) + '\nCristales ' + got + '/' + total + ' · +' + S.pts + ' pts';
  S.total += S.pts; sfx('win'); buzz([20, 40, 20, 40, 20]);
  if(S.lvl >= LEVELS.length - 1){
    showCard('¡Lo lograste!', 'Puntos totales: ' + S.total + '\n' + info.split('\n')[0], 'Volver al inicio', showTitle);
  } else {
    showCard('Nivel ' + (S.lvl + 1) + ' completado', info + '\nVidas: ' + S.lives, 'Siguiente nivel', () => startLevel(S.lvl + 1));
  }
}

// ================= 9. física e inteligencia de los enemigos =================
function step(){
  frameN++;
  if(S.banner > 0) S.banner--;
  if(S.state !== 'play' || !L) return;
  const d = L.def, b = L.boss;
  if(P.inv > 0) P.inv--;
  if(S.boostT > 0) S.boostT--;
  if(S.cool > 0) S.cool--;

  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  P.vx = dir * RUN;
  if(dir) P.facing = dir;

  // salto con buffer: si presionas un poco antes de caer, salta al tocar el suelo
  if(input.jumpQ){ input.jumpQ = false; P.jbuf = JBUF; }
  if(P.jbuf > 0) P.jbuf--;
  if(P.jbuf > 0 && P.onGround){
    P.vy = S.boostT > 0 ? BOOST_JUMP : JUMP;
    P.onGround = false; P.jbuf = 0; sfx('jump');
  }

  if(input.throwQ){
    input.throwQ = false;
    if(S.boostT > 0 && S.cool <= 0){
      L.proj.push({ x:P.x + P.facing*14, y:P.y - PH*0.6, vx:P.facing*7, life:80, dead:false });
      S.cool = THROW_CD; sfx('jump');
    }
  }

  P.x = Math.max(PW/2, Math.min(d.len - PW/2, P.x + P.vx));
  const prevY = P.y;
  P.vy = Math.min(P.vy + G, MAXFALL);
  P.y += P.vy;
  P.onGround = false;
  if(P.vy >= 0){
    for(const p of L.plats){
      if(P.x + PW/2 > p.x && P.x - PW/2 < p.x + p.w && prevY <= p.y + 1 && P.y >= p.y){
        P.y = p.y; P.vy = 0; P.onGround = true; P.combo = 0;
        P.check = { x:Math.max(p.x + 14, Math.min(p.x + p.w - 14, P.x)), y:p.y };
        break;
      }
    }
  }
  if(P.y > H + 60){ pitFall(); return; }

  const walking = P.onGround && dir !== 0;
  if(walking) P.walk += 0.32;
  P.tilt += ((walking ? Math.sin(P.walk) * 0.14 : 0) - P.tilt) * 0.25;

  const pr = box(P.x - PW/2, P.x + PW/2, P.y - PH, P.y);

  // ---- Walter: patrulla, se alerta al verte en su plataforma, te persigue anticipando tu movimiento,
  //      y si te pierde va al último lugar donde te vio antes de volver a patrullar
  for(const e of L.enemies){
    if(!e.alive) continue;
    const seeing = P.onGround && P.x > e.p.x && P.x < e.p.x + e.p.w &&
                   Math.abs(P.y - e.p.y) < 2 && Math.abs(P.x - e.x) < DETECT_X;
    if(seeing){
      e.seen = P.x; e.lost = 0;
      if(e.state === 'patrol'){ e.state = 'alert'; e.timer = ALERT_F; }
    } else if(e.state !== 'patrol'){
      if(e.state === 'alert'){ e.state = 'patrol'; }
      else { e.lost++; if(e.lost > LOSE_F){ e.state = 'patrol'; e.lost = 0; } }
    }
    if(e.state === 'alert'){
      e.vx = 0; e.timer--;
      if(e.timer <= 0) e.state = 'chase';
    } else if(e.state === 'chase'){
      const goal = seeing ? P.x + P.vx * 10 : e.seen;
      if(Math.abs(goal - e.x) < 3){ e.vx = 0; }
      else { e.dir = goal > e.x ? 1 : -1; e.vx = e.dir * CHASE_K * diff.enemy; }
    } else {
      e.vx = e.dir * 0.8 * diff.enemy;
    }
    e.x += e.vx;
    if(e.x < e.minX){ e.x = e.minX; if(e.state === 'patrol') e.dir = 1; }
    if(e.x > e.maxX){ e.x = e.maxX; if(e.state === 'patrol') e.dir = -1; }
    e.wob += e.state === 'chase' ? 0.35 : 0.18;

    if(overlap(pr, box(e.x - 18, e.x + 18, e.y, e.y + 26))){
      if(P.vy > 0 && prevY <= e.y + 8){
        e.alive = false; P.vy = -7; P.combo++;
        const mult = Math.min(P.combo, 5);
        killFx(e.x, e.y, 50 * mult, mult > 1 ? 'x' + mult : '');
      } else if(S.boostT > 0){
        e.alive = false; killFx(e.x, e.y, 50, '');
      } else { hurt(); if(S.state !== 'play') return; }
    }
  }

  // ---- Big Walter: patrulla, avisa, carga, se marea y (fase 2) lanza humo-cigarros
  if(b && b.alive){
    if(b.immune > 0) b.immune--;
    b.wob += 0.12;
    b.t++;
    const phase2 = b.hp <= b.maxHp / 2;
    const playerNear = P.x > b.minX - 60 && P.x < b.maxX + 60;
    if(b.st === 'patrol'){
      b.vx = b.dir * 0.9 * diff.bossSpd;
      b.x += b.vx;
      if(b.x < b.minX){ b.x = b.minX; b.dir = 1; }
      if(b.x > b.maxX){ b.x = b.maxX; b.dir = -1; }
      b.cd--;
      if(phase2) b.fireCd--;
      if(b.cd <= 0 && playerNear){ b.st = 'windup'; b.t = 0; b.tx = P.x; }
      else if(phase2 && b.fireCd <= 0){ b.st = 'fire'; b.t = 0; b.fireCd = isHard() ? 110 : 160; }
    } else if(b.st === 'windup'){
      if(b.t >= (isHard() ? 30 : 44)){
        b.st = 'charge'; b.t = 0;
        b.dir = b.tx >= b.x ? 1 : -1;
        b.vx = b.dir * (isHard() ? 4.4 : 3.6);
      }
    } else if(b.st === 'charge'){
      b.x += b.vx;
      const wall = b.x <= b.minX || b.x >= b.maxX;
      b.x = Math.max(b.minX, Math.min(b.maxX, b.x));
      if(wall || b.t >= 80){ b.st = 'dizzy'; b.t = 0; b.vx = 0; sfx('hit'); addFloat(b.x, b.top, '¡Uf!'); }
    } else if(b.st === 'dizzy'){
      if(b.t >= (isHard() ? 60 : 85)){
        b.st = 'patrol'; b.t = 0; b.cd = isHard() ? 130 : 210;
        b.dir = P.x < b.x ? -1 : 1;
      }
    } else if(b.st === 'fire'){
      if(b.t === 24){
        L.bproj.push({ x:b.x, y:b.top + 50, vx:(P.x < b.x ? -1 : 1) * (isHard() ? 4.2 : 3.4), life:150, dead:false });
      }
      if(b.t >= 40){ b.st = 'patrol'; b.t = 0; }
    }

    if(overlap(pr, box(b.x - 34, b.x + 34, b.top, b.top + 84))){
      if(P.vy > 0 && prevY <= b.top + 8){ P.vy = -9; P.combo++; bossHit(); }
      else { hurt(); if(S.state !== 'play') return; }
    }
  }

  // ---- proyectiles del jefe: hay que saltarlos
  for(const q of L.bproj){
    q.x += q.vx; q.life--;
    if(!q.dead && overlap(pr, box(q.x - 7, q.x + 7, q.y - 7, q.y + 7))){
      q.dead = true; hurt(); if(S.state !== 'play') return;
    }
  }
  L.bproj = L.bproj.filter(q => !q.dead && q.life > 0 && q.x > -40 && q.x < d.len + 40);

  // ---- tus cigarros: matan a Walter, dañan al jefe y bloquean sus humos
  for(const q of L.proj){
    q.x += q.vx; q.life--;
    for(const e of L.enemies){
      if(!e.alive || q.dead) continue;
      if(q.x > e.x - 20 && q.x < e.x + 20 && q.y > e.y - 6 && q.y < e.y + 30){
        e.alive = false; q.dead = true; killFx(e.x, e.y, 50, '');
      }
    }
    if(!q.dead) for(const bq of L.bproj){
      if(!bq.dead && Math.abs(bq.x - q.x) < 14 && Math.abs(bq.y - q.y) < 12){
        bq.dead = true; q.dead = true; addFloat(q.x, q.y - 10, '¡Bloqueado!'); S.pts += 10;
      }
    }
    if(b && b.alive && !q.dead && q.x > b.x - 34 && q.x < b.x + 34 && q.y > b.top && q.y < b.top + 84){
      q.dead = true; bossHit();
    }
  }
  L.proj = L.proj.filter(q => !q.dead && q.life > 0 && q.x > -30 && q.x < d.len + 30);

  // ---- cristales y globo
  const cx = P.x, cy = P.y - PH/2;
  for(const c of L.crystals){
    if(!c.got && Math.hypot(c.x - cx, c.y - cy) < 22){
      c.got = true; S.pts += 10; sfx('pick'); addFloat(c.x, c.y, '+10');
    }
  }
  for(const c of L.chilis){
    if(!c.got && Math.hypot(c.x - cx, c.y - cy) < 26){
      c.got = true; S.boostT = BOOST_FRAMES; S.pts += 20;
      sfx('power'); buzz([15, 40, 15]); addFloat(c.x, c.y, '¡Globo!');
    }
  }

  if((!b || !b.alive) && P.onGround && Math.abs(P.x - d.goal) < 30){ levelComplete(); return; }

  for(const p of L.pops) p.t++;
  L.pops = L.pops.filter(p => p.t < p.dur);
  for(const f of L.flo) f.t++;
  L.flo = L.flo.filter(f => f.t < 50);
  camX = Math.max(0, Math.min(d.len - W, P.x - W*0.45));
}

// ================= 10. dibujo =================
function rr(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
function drawPlat(x, y, w){
  const g = ctx.createLinearGradient(0, y, 0, y + 18);
  g.addColorStop(0, '#ffd08a'); g.addColorStop(0.35, '#e08a4a'); g.addColorStop(1, '#7a2f1c');
  ctx.fillStyle = g; rr(x, y, w, 18, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,240,200,.55)'; rr(x+3, y+1, w-6, 3, 2); ctx.fill();
  ctx.strokeStyle = 'rgba(40,8,0,.55)'; ctx.lineWidth = 1.2; rr(x, y, w, 18, 7); ctx.stroke();
}
function drawSpr(im, x, y, h, rot = 0, sx = 1, alpha = 1){
  if(!ready(im)) return;
  const w = h * im.naturalWidth / im.naturalHeight;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sx, 1);
  ctx.drawImage(im, -w/2, -h/2, w, h); ctx.restore();
}
function render(){
  ctx.clearRect(0, 0, W, H);
  if(!L) return;
  const d = L.def, bg = BG[d.bg], b = L.boss;
  if(ready(bg)){
    const s = Math.max(W / bg.naturalWidth, H / bg.naturalHeight);
    const dw = bg.naturalWidth * s, dh = bg.naturalHeight * s;
    const ox = -(camX / (d.len - W)) * (dw - W);
    ctx.drawImage(bg, ox, (H - dh) / 2, dw, dh);
  }
  ctx.fillStyle = 'rgba(20,6,30,.12)'; ctx.fillRect(0, 0, W, H);

  // meta
  const gp = L.plats.find(p => d.goal >= p.x && d.goal <= p.x + p.w);
  const gy = gp ? gp.y : 440, gx = d.goal - camX;
  const open = !b || !b.alive;
  ctx.fillStyle = 'rgba(255,240,220,.85)'; ctx.fillRect(gx, gy - 74, 3, 74);
  ctx.fillStyle = open ? '#ffd166' : 'rgba(160,160,190,.6)';
  ctx.beginPath(); ctx.moveTo(gx+3, gy-74); ctx.lineTo(gx+30, gy-62); ctx.lineTo(gx+3, gy-50); ctx.closePath(); ctx.fill();

  for(const p of L.plats){
    const x = p.x - camX;
    if(x > W + 4 || x + p.w < -4) continue;
    drawPlat(x, p.y, p.w);
  }

  for(const c of L.crystals){
    if(c.got) continue;
    const bob = Math.sin(frameN*0.08 + c.x*0.1) * 3;
    const sk = 0.82 + 0.18 * Math.sin(frameN*0.1 + c.x);
    drawSpr(SPR.cristal, c.x - camX, c.y + bob, 34, 0, sk, 1);
  }
  for(const c of L.chilis){
    if(c.got) continue;
    const gx2 = c.x - camX, gy2 = c.y + Math.sin(frameN*0.1 + c.x) * 2;
    const gr = ctx.createRadialGradient(gx2, gy2, 2, gx2, gy2, 26);
    gr.addColorStop(0, 'rgba(255,170,60,.55)'); gr.addColorStop(1, 'rgba(255,170,60,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(gx2, gy2, 26, 0, Math.PI*2); ctx.fill();
    drawSpr(SPR.chili, gx2, gy2, 38 * (1 + 0.06*Math.sin(frameN*0.2)), Math.sin(frameN*0.08)*0.12, 1, 1);
  }

  // Walter con su estado a la vista
  for(const e of L.enemies){
    if(!e.alive) continue;
    const ex = e.x - camX;
    drawSpr(SPR.walter, ex, e.y + 13, 30, Math.sin(e.wob) * (e.state === 'chase' ? 0.18 : 0.1), e.dir > 0 ? 1 : -1, 1);
    if(e.state === 'alert' || e.state === 'chase'){
      ctx.fillStyle = e.state === 'alert' ? '#ff5e3a' : '#ffb347';
      ctx.font = 'bold 18px "Arial Black", Impact, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('!', ex, e.y - 6 + Math.sin(frameN*0.4) * 2);
    }
  }

  // Big Walter con avisos: temblor antes de cargar, estrellas al marearse, humo antes de disparar
  if(b && b.alive){
    const shake = b.st === 'windup' ? Math.sin(frameN * 1.6) * 3 : 0;
    const bx = b.x - camX + shake;
    if(b.st === 'windup' || b.st === 'charge'){
      const gg = ctx.createRadialGradient(bx, b.top + 42, 10, bx, b.top + 42, 64);
      gg.addColorStop(0, 'rgba(255,60,40,.45)'); gg.addColorStop(1, 'rgba(255,60,40,0)');
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(bx, b.top + 42, 64, 0, Math.PI*2); ctx.fill();
    }
    const blink = b.immune > 0 && (frameN % 8 < 4);
    const tilt = Math.sin(b.wob) * 0.07 + (b.st === 'dizzy' ? Math.sin(frameN * 0.5) * 0.12 : 0);
    drawSpr(SPR.boss, bx, b.top + 42, 90, tilt, b.dir > 0 ? 1 : -1, blink ? 0.35 : 1);
    if(b.st === 'dizzy'){
      ctx.fillStyle = '#ffe08a'; ctx.font = '16px "Trebuchet MS", Arial'; ctx.textAlign = 'center';
      for(let k = 0; k < 3; k++){
        const a = frameN * 0.1 + k * 2.1;
        ctx.fillText('✦', bx + Math.cos(a) * 34, b.top - 4 + Math.sin(a) * 6);
      }
    }
    if(b.st === 'fire' && b.t < 24){
      ctx.fillStyle = 'rgba(230,220,200,' + (0.25 + 0.5 * (b.t / 24)) + ')';
      ctx.beginPath(); ctx.arc(bx - b.dir * 26, b.top + 48, 6 + b.t * 0.3, 0, Math.PI*2); ctx.fill();
    }
  }

  for(const q of L.proj){
    if(!ready(SPR.cigarro)) break;
    ctx.save(); ctx.translate(q.x - camX, q.y); ctx.rotate(q.vx > 0 ? Math.PI/2 : -Math.PI/2);
    ctx.drawImage(SPR.cigarro, -3, -20, 6, 40); ctx.restore();
  }
  for(const q of L.bproj){
    const qx = q.x - camX;
    const g = ctx.createRadialGradient(qx, q.y, 2, qx, q.y, 16);
    g.addColorStop(0, 'rgba(255,90,60,.8)'); g.addColorStop(1, 'rgba(255,90,60,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(qx, q.y, 16, 0, Math.PI*2); ctx.fill();
    ctx.save(); ctx.translate(qx, q.y); ctx.rotate(q.vx > 0 ? Math.PI/2 : -Math.PI/2);
    if(ready(SPR.cigarro)) ctx.drawImage(SPR.cigarro, -3, -18, 6, 36); ctx.restore();
  }

  for(const p of L.pops){
    const k = p.t / p.dur;
    drawSpr(SPR.llorn, p.x - camX, p.y - k*40, (p.big ? 90 : 50) * (1 + 0.15*Math.sin(k*3)), 0, 1, 1 - k);
  }

  // Pikman (o Pikman globo con el potenciador)
  const boosted = S.boostT > 0;
  const px = P.x - camX;
  if(boosted){
    const ag = ctx.createRadialGradient(px, P.y - PH/2, 4, px, P.y - PH/2, 34);
    ag.addColorStop(0, 'rgba(255,220,120,.4)'); ag.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(px, P.y - PH/2, 34, 0, Math.PI*2); ctx.fill();
  }
  const bob = (P.onGround && P.vx !== 0) ? -Math.abs(Math.sin(P.walk)) * 2.5 : 0;
  const blink = P.inv > 0 && (frameN % 6 < 3);
  drawSpr(boosted ? SPR.globo : SPR.pikman, px, P.y - (boosted ? 23 : 25) + bob,
          boosted ? 46 : 50, P.tilt, P.facing, blink ? 0.3 : 1);

  // barra de vida del jefe
  if(b && b.alive){
    const bw = 220, bxx = W/2 - bw/2, by = 14;
    ctx.fillStyle = 'rgba(20,6,30,.75)'; rr(bxx - 3, by - 3, bw + 6, 20, 9); ctx.fill();
    ctx.fillStyle = '#ff5e3a'; rr(bxx, by, bw * (b.hp / b.maxHp), 14, 6); ctx.fill();
    ctx.fillStyle = '#fff4e0'; ctx.font = 'bold 11px "Trebuchet MS", Arial'; ctx.textAlign = 'center';
    ctx.fillText('BIG WALTER', W/2, by + 40);
  }

  ctx.font = 'bold 14px "Trebuchet MS", Arial'; ctx.textAlign = 'center'; ctx.lineWidth = 3;
  for(const f of L.flo){
    const tx = f.x - camX, ty = f.y - f.t * 0.6;
    ctx.globalAlpha = 1 - f.t/50;
    ctx.strokeStyle = 'rgba(20,6,30,.85)'; ctx.strokeText(f.s, tx, ty);
    ctx.fillStyle = '#ffe08a'; ctx.fillText(f.s, tx, ty);
  }
  ctx.globalAlpha = 1;

  if(S.banner > 0){
    ctx.globalAlpha = Math.min(1, S.banner / 30);
    ctx.fillStyle = 'rgba(20,6,30,.6)'; ctx.fillRect(0, H*0.42, W, 62);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe08a'; ctx.font = 'bold 22px "Arial Black", Impact, sans-serif';
    ctx.fillText('Nivel ' + (S.lvl + 1), W/2, H*0.42 + 28);
    ctx.fillStyle = '#fff4e0'; ctx.font = '16px "Trebuchet MS", Arial';
    ctx.fillText(d.name, W/2, H*0.42 + 52);
    ctx.globalAlpha = 1;
  }
}

// ================= 11. HUD y pantallas =================
const hPikman = $('hPikman'), hCrys = $('hCrys'), hLives = $('hLives'), hPts = $('hPts'),
      hLvl = $('hLvl'), boostFill = $('boostFill'), thrImg = $('thrImg'), bT = $('bT'), card = $('card');
function updateHud(){
  if(!L) return;
  hLives.textContent = S.lives;
  hPts.textContent = S.total + S.pts;
  hLvl.textContent = 'Nivel ' + (S.lvl + 1) + ' · ' + L.def.name;
  const warn = S.boostT > 0 && S.boostT < 120 && (S.boostT % 20) < 10;   // parpadea cuando se acaba el globo
  boostFill.style.width = (S.boostT / BOOST_FRAMES * 100).toFixed(1) + '%';
  boostFill.style.background = warn ? '#ff6b6b' : '';
  bT.classList.toggle('dim', S.boostT <= 0);
}
function showScreen(n){ $('scTitle').classList.toggle('on', n === 'title'); $('scPlay').classList.toggle('on', n === 'play'); }
function showCard(t, txt, label, fn){
  $('cTitle').textContent = t; $('cText').textContent = txt; $('cText').style.whiteSpace = 'pre-line';
  $('cBtn').textContent = label; $('cBtn').onclick = fn; card.classList.add('on');
}
function hideCard(){ card.classList.remove('on'); }
function showTitle(){ S.state = 'title'; L = null; hideCard(); showScreen('title'); }
function startLevel(i){
  S.lvl = i; S.lives = diff.lives; S.pts = 0; S.boostT = 0; S.cool = 0;
  input.left = input.right = input.jumpQ = input.throwQ = false;
  buildLevel(i); S.state = 'play'; S.banner = 120;
  hideCard(); showScreen('play'); updateHud();
}
function startGame(key){ diff = DIFF[key]; S.total = 0; startLevel(0); }

// ================= 12. bucle =================
let running = false, lastT = null, acc = 0;
function loop(t){
  if(!running) return;
  if(lastT === null) lastT = t;
  acc += Math.min(100, t - lastT); lastT = t;
  while(acc >= STEP){ step(); acc -= STEP; }
  render(); updateHud();
  requestAnimationFrame(loop);
}
function startLoop(){ if(running) return; running = true; lastT = null; acc = 0; requestAnimationFrame(loop); }
function stopLoop(){ running = false; }

// ================= 13. controles =================
function hold(el, key){
  const on = e => { e.preventDefault(); input[key] = true; };
  const off = () => { input[key] = false; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
hold($('bL'), 'left'); hold($('bR'), 'right');
$('bJ').addEventListener('pointerdown', e => { e.preventDefault(); input.jumpQ = true; });
$('bT').addEventListener('pointerdown', e => { e.preventDefault(); input.throwQ = true; });
const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right' };
addEventListener('keydown', e => {
  if(KEYMAP[e.code]){ input[KEYMAP[e.code]] = true; e.preventDefault(); }
  else if((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && !e.repeat){ input.jumpQ = true; e.preventDefault(); }
  else if((e.code === 'KeyX' || e.code === 'KeyK') && !e.repeat){ input.throwQ = true; }
});
addEventListener('keyup', e => { if(KEYMAP[e.code]) input[KEYMAP[e.code]] = false; });
document.addEventListener('contextmenu', e => e.preventDefault());
$('soundBtn').onclick = () => { soundOn = !soundOn; $('soundBtn').textContent = soundOn ? '🔊' : '🔇'; };
$('btnEasy').onclick = () => startGame('easy');
$('btnHard').onclick = () => startGame('hard');

// ================= 14. arranque =================
$('hero').src = SPR.globo.src;
$('thrImg').src = SPR.cigarro.src;
$('hPikman').src = SPR.pikman.src;
$('hCrys').src = SPR.cristal.src;
$('scTitle').style.backgroundImage = "linear-gradient(rgba(29,10,42,.35),rgba(29,10,42,.88)), url('" + BG[1].src + "')";
showScreen('title');
startLoop();
</script>
